name: Python 4

on:
  workflow_dispatch:
    

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py

      - name: test
        run: pytest -v

  image:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: docker
        run: |
          docker build -t projeto:1.0 python/
          docker run -d -p 8080:8080 --name projeto-py projeto:1.0 


